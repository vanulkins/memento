server {
    listen 80;
    listen [::]:80;
    server_name memento.ivann.fun;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memento.ivann.fun;
    ssl_certificate /etc/letsencrypt/live/memento.ivann.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memento.ivann.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1500k;
    client_body_buffer_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/mobile/v1/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 125s;
    }
    location /health { proxy_pass http://127.0.0.1:8793/health; }
    location / { return 404; }
}
